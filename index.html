<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagerfinner - Komplette Oversikt</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --card-bg: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --highlight: #22c55e;
            --border-color: #475569;
            --special-border: #f97316;
            --break-bg: #312e81;
            --break-border: #6366f1;
            --middle-bg: #0f3854;
            --middle-border: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header { max-width: 1400px; margin: 0 auto 16px auto; width: 100%; text-align: center; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 2px; }
        .update-date { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; opacity: 0.7; }
        .subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px; }

        .search-container { max-width: 600px; margin: 0 auto 20px auto; width: 100%; position: sticky; top: 12px; z-index: 100; }
        .search-box { position: relative; width: 100%; display: flex; align-items: center; }
        #searchInput { width: 100%; padding: 16px 55px 16px 50px; font-size: 1.25rem; font-weight: 600; border: 2px solid var(--accent); border-radius: 12px; background-color: var(--panel-bg); color: #ffffff; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); outline: none; }
        #searchInput:focus { border-color: var(--highlight); box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.25); }
        
        .clear-btn { position: absolute; left: 16px; background: none; border: none; color: var(--text-muted); font-size: 1.3rem; cursor: pointer; padding: 4px; display: none; align-items: center; justify-content: center; transition: color 0.2s; z-index: 5; width: 30px; height: 30px; }
        .clear-btn:hover { color: #ffffff; }

        .search-btn { position: absolute; right: 16px; background: none; border: none; color: var(--accent); font-size: 1.4rem; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; transition: color 0.2s; z-index: 5; width: 30px; height: 30px; }
        .search-btn:hover { color: var(--highlight); }

        .search-results-info { font-size: 0.85rem; font-weight: 600; text-align: center; margin-top: 6px; min-height: 20px; }
        .search-results-info.success { color: var(--highlight); }
        .search-results-info.zero { color: #ef4444; }

        .warehouse-scroll-wrapper { width: 100%; overflow-x: auto; padding-bottom: 16px; scroll-behavior: smooth; }
        .warehouse-layout { display: flex; gap: 16px; min-width: max-content; align-items: stretch; justify-content: center; }
        
        .line-column { display: flex; flex-direction: column; gap: 12px; width: 170px; flex-shrink: 0; }
        .left-side-container, .right-side-container { display: flex; gap: 12px; }
        
        .line-column.split-below-middle { justify-content: flex-start; }
        .line-column.split-bottom-special { justify-content: space-between; height: 100%; }
        .line-column.split-bottom-special > .line-card:last-child { margin-top: auto; }

        /* Gezielter Abstand nur für einzelne Karten via Array */
        .line-card.push-down-card { margin-top: 250px; }

        .center-column { display: flex; flex-direction: column; gap: 12px; width: 180px; flex-shrink: 0; }
        .break-room { background-color: var(--break-bg); border: 2px dashed var(--break-border); border-radius: 10px; padding: 10px; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 70px; }
        .break-room .icon { font-size: 1.3rem; margin-bottom: 2px; }
        .break-room .title { font-weight: 800; font-size: 0.85rem; color: #a5b4fc; }

        .lager-mitte { background-color: var(--middle-bg); border: 2px solid var(--middle-border); border-radius: 10px; padding: 20px; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: inset 0 0 15px rgba(0,0,0,0.3); flex-grow: 1; }
        .lager-mitte .icon { font-size: 2.2rem; margin-bottom: 8px; }
        .lager-mitte .title { font-weight: 800; font-size: 1.1rem; color: #7dd3fc; letter-spacing: 1px; }
        
        .line-card { background-color: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 10px; padding: 12px; width: 100%; display: flex; flex-direction: column; transition: all 0.25s ease; position: relative; }
        .card-uid { position: absolute; top: 4px; left: 8px; font-size: 0.6rem; color: var(--text-muted); opacity: 0.5; }
        .special-card { border-color: var(--special-border) !important; background-color: #2a1b18; }
        .line-header { background-color: var(--card-bg); border-radius: 6px; padding: 8px; text-align: center; margin-top: 8px; margin-bottom: 10px; border-bottom: 3px solid var(--accent); }
        .special-card .line-header { border-bottom-color: var(--special-border) !important; }
        .line-number { font-size: 1rem; font-weight: 800; color: var(--accent); }
        .special-card .line-number { color: var(--special-border); }
        
        .city-list { display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
        .city-item { background-color: rgba(255, 255, 255, 0.05); padding: 6px 8px; border-radius: 6px; font-size: 0.85rem; color: #e2e8f0; }
        .line-card.active { border-color: var(--highlight) !important; background-color: #064e3b !important; transform: translateY(-4px); box-shadow: 0 10px 20px -5px rgba(34, 197, 94, 0.4); }
        .city-item.match { background-color: var(--highlight); color: #ffffff; font-weight: 700; }
        .line-card.dimmed { opacity: 0.25; filter: grayscale(80%); }
    </style>
</head>
<body>

    <header>
        <h1>Lagerfinner</h1>
        <div class="update-date">Oppdatert: 23.08.2026</div>
        <p class="subtitle">Skriv inn stedsnavn og trykk Enter for å søke / hoppe til neste resultat.</p>
    </header>

    <div class="search-container">
        <div class="search-box">
            <button id="clearBtn" class="clear-btn" title="Nullstill søk">✕</button>
            <input type="text" id="searchInput" placeholder="Søk etter sted..." autofocus autocomplete="off">
            <button id="searchBtn" class="search-btn" title="Søk / Neste resultat">➔</button>
        </div>
        <div id="searchResultsInfo" class="search-results-info"></div>
    </div>

    <div class="warehouse-scroll-wrapper" id="scrollWrapper">
        <div class="warehouse-layout">
            <!-- Linke Seite -->
            <div class="left-side-container" id="leftLinesContainer"></div>

            <!-- Mitte -->
            <div class="center-column" id="centerColumn">
                <div class="break-room">
                    <div class="icon">☕</div>
                    <div class="title">PAUSEROM</div>
                </div>
                <div class="lager-mitte">
                    <div class="icon">📦</div>
                    <div class="title">LAGER MIDT</div>
                </div>
            </div>

            <!-- Rechte Seite -->
            <div class="right-side-container" id="rightLinesContainer"></div>
        </div>
    </div>

    <script>
        const warehouseStructure = {
            leftGroup: [
                { id: 1, uid: "1", name: "(V) Linje 1", cities: ["Malmefjord", "Eide"] },
                { id: 2, uid: "2", name: "(V) Linje 2", cities: ["Molde", "Vestnes"] },
                { id: 3, uid: "3", name: "(V) Linje 3", cities: ["Kristiansund"] },
                { id: 4, uid: "4", name: "(V) Linje 4", cities: ["Kristiansand"] },
                { id: 5, uid: "5", name: "(V) Linje 5", cities: ["Arendal", "Grimstad", "Kragerø / Fevik", "Sannidal / Risør"] },
                { id: 6, uid: "6", name: "(V) Linje 6", cities: ["Porsgrunn", "Skien", "Stathelle", "Rjukan"] },
                { id: 7, uid: "7", name: "(V) Linje 7", cities: ["Sandefjord", "Larvik", "Stavern"] },
                { id: 8, uid: "8", name: "(V) Linje 8", cities: ["Tønsberg", "Horten", "Holmestrand"] },
                { id: 9, uid: "9", name: "(V) Linje 9", cities: ["Fredrikstad", "Rolvsøy", "Sarpsborg", "Mysen / Rakkestad", "Berg i Østfold", "Halden"] },
                { id: 10, uid: "10", name: "(V) Linje 10", cities: ["Vinterbro", "Ski", "Moss", "Langhus", "Drøbak", "Vestby"] },
                { id: 11, uid: "11", name: "(V) Linje 11", cities: ["Terminal Ramberg", "Bjørkelangen", "Aurskog"] },
                { id: 12, uid: "12", name: "(V) Linje 12", cities: ["Frogner"] },
                { id: 13, uid: "13", name: "(V) Linje 13", cities: ["Møbelringen Alna", "Billingstad"] },
                { id: 14, uid: "14", name: "(V) Linje 14", cities: ["Skeidar (Oslo)", "A-Møbler (Oslo)", "Bohus Alna (Oslo)"] },
                { id: 15, uid: "15", name: "(V) Linje 15", cities: ["Drammen"] },
                { id: 16, uid: "16", name: "(V) Linje 16", cities: ["Nesbru"] },
                { id: 17, uid: "17", name: "(V) Linje 17", cities: ["Notodden", "Mjøndalen", "Kongsberg", "Hokksund"] },
                { id: 18, uid: "18", name: "(V) Linje 18", cities: ["Lillestrøm", "Skedsmokorset", "Strømmen", "Hagan"] },
                { id: 19, uid: "19", name: "(V) Linje 19", cities: ["Møbelringen Lørenskog"] },
                { id: 20, uid: "20", name: "(V) Linje 20", cities: ["Logistikk", "Bohus", "Fetsund"] },
                { id: 21, uid: "21", name: "(V) Linje 21", cities: ["Leira / Geilo", "Fagernes", "Gol. / Nesbyen", "Røn"], splitBelow: true, bottomLine: { id: 22, uid: "22", name: "(V) Linje 22", isSpecial: true, cities: ["Ålesund", "Brattvåg / Søvik", "Digernes", "Giske / Valerøy / Vigra", "Hellandshamn", "Åheim"] } }
            ],
            rightGroup: [
                { id: 23, uid: "23", name: "(H) Linje 23", cities: ["Hønefoss"], splitBelow: true, bottomLine: { id: 24, uid: "24", name: "(H) Linje 24", isSpecial: true, cities: ["Skeidar, Ålesund"] } },
                { id: 25, uid: "25", name: "(H) Linje 25", cities: ["Raufoss"] },
                { id: 26, uid: "26", name: "(H) Linje 26", cities: ["Gjøvik", "Gran", "Dokka", "Lena", "Harestua"] },    
                { id: 27, uid: "27", name: "(H) Linje 27", cities: ["Kongsvinger", "Årnes", "Skarnes"] },
                { id: 28, uid: "33", name: "(H) Linje 33", cities: ["Sauda, Bremnes"], splitBelow: true, bottomLine: { id: 29, uid: "28", name: "(H) Linje 28", cities: ["Elverum", "Trysil"] } },
                { id: 30, uid: "34", name: "(H) Linje 34", cities: ["Åkrehamn, Kopervik"], splitBelow: true, bottomLine: { id: 31, uid: "29", name: "(H) Linje 29", cities: ["Hamar", "Furnes", "Brumunddal"] } },
                { id: 32, uid: "35", name: "(H) Linje 35", cities: ["Haugesund Terminal", "Stord", "Fitjar"], splitBelow: true, bottomLine: { id: 33, uid: "30", name: "(H) Linje 30", cities: ["Jessheim", "Dal", "Eidsvoll"] } },
                { id: 34, uid: "36", name: "(H) Linje 36", cities: ["Bohus Vikse, Haugesund"], splitBelow: true, bottomLine: { id: 35, uid: "31", name: "(H) Linje 31", cities: ["Lillehammer", "Otta / Sørfron", "Åndalsnes"] } },
                { id: 36, uid: "37", name: "(H) Linje 37", cities: ["Møbelringen Math Lande, Haugesund"], splitBelow: true, bottomLine: { id: 37, uid: "32", name: "(H) Linje 32", cities: ["Slettvoll Oslo"] } },
                { id: 38, uid: "38", name: "(H) Linje 38", cities: ["Haugesund, Skeidar"], splitBelow: true, bottomLine: { id: 39, uid: "39", name: "(H) Linje 39", cities: ["Slettvoll In-Design, Fine Møbler Haugesund"] } },
                { id: 40, uid: "40", name: "(H) Linje 40", cities: ["Ølen, Etne"], splitBelow: true, bottomLine: { id: 41, uid: "41", name: "(H) Linje 41", cities: ["Flekkefjord", "Egersund", "Lyngdal", "Mandal"] } },
                { id: 42, uid: "42", name: "(H) Linje 42", cities: ["Bryne", "Kleppe"], splitBelow: true, bottomLine: { id: 43, uid: "43", name: "(H) Linje 43", isSpecial: true, cities: ["Ulsteinvik", "Hareid", "Fosnavåg"] } },
                { id: 44, uid: "44", name: "(H) Linje 44", cities: ["Stavanger Terminal", "Haukaas", "Jørpeland", "Slettvoll"], splitBelow: true, bottomLine: { id: 45, uid: "45", name: "(H) Linje 45", isSpecial: true, cities: ["Hovdebygda", "Ørsta", "Volda"] } },
                { id: 46, uid: "46", name: "(H) Linje 46", cities: ["Stavanger", "Skeidar Tvedtsenter", "Skeidar Forus", "Fagmøbler Forus"] },
                { id: 47, uid: "47", name: "(H) Linje 47", cities: ["Sandnes"] },
                { id: 48, uid: "48", name: "(H) Linje 48", cities: ["Straume", "Godvik"], splitBelow: true, bottomLine: { id: 49, uid: "62", name: "(H) Linje 62", isSpecial: true, cities: ["Førde", "Florø", "Sandane", "Nordfjordeid", "Stryn", "Leirvik i Sogn", "Byastad"] } },
                { id: 50, uid: "49", name: "(H) Linje 49", cities: ["Fyllingsdalen", "Kleppestø", "Strusshamn"] },
                { id: 51, uid: "50", name: "(H) Linje 50", cities: ["Slettvoll Nyborg", "Ulset"] },
                { id: 52, uid: "51", name: "(H) Linje 51", cities: ["Isdalstø Front", "Rådal 2 Bak"], splitBelow: true, bottomLine: { id: 53, uid: "52", name: "(H) Linje 52", isSpecial: true, cities: ["Mosjøen", "Mo i Rana", "Sandnessjøen", "Brønnøysund", "Fauske", "Harstad", "Bardu", "Finnsnes", "Tromsø", "Bodø", "Lofoten"] } },
                { id: 54, uid: "53", name: "(H) Linje 53", cities: ["Rådal", "Nesstun", "Kokstad", "Blomsterdalen", "Paradis"] },
                { id: 55, uid: "54", name: "(H) Linje 54", cities: ["Sogndal", "Kaupanger", "Øvre Årdal", "Voss", "Øystese"] },
                { id: 56, uid: "55", name: "(H) Linje 55", cities: ["Namsos", "Spillum", "Kolvereid", "Steinkjær"] },
                { id: 57, uid: "56", name: "(H) Linje 56", cities: ["Stjørdal", "Verdal", "Levanger"] },
                { id: 58, uid: "57", name: "(H) Linje 57", cities: ["Møbelringen Lade", "Bohus Bo Møbler", "Bohus Tynset"] },
                { id: 59, uid: "58", name: "(H) Linje 58", cities: ["Skeidar, Trondheim", "Tiller", "Orkanger", "Slettvoll Berge"] },
                { id: 60, uid: "60", name: "(H) Linje 60", cities: ["Terminal Trøndelag", "Hitra", "Røros", "Brekstad", "Åfjord", "Kyrkjeseterøyra"] },
                { id: 61, uid: "59", name: "(H) Linje 59", cities: ["Orkanger", "Surnadal", "Sunndalsøra", "Oppdal", "Leinstrand"], splitBelow: true, bottomLine: { id: 62, uid: "61", name: "(H) Linje 61", isSpecial: true, cities: ["Finnmark", "Sortland", "Bardufoss", "Lofoten", "Sandnessjøen", "Brønnøysund"] } }
            ]
        };

        function normalizeText(t) { return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[æøå]/g, m => ({'æ':'a','ø':'o','å':'a'}[m])); }

        function createCard(item) {
            const card = document.createElement('div');
            card.className = `line-card ${item.isSpecial ? 'special-card' : ''}`;
            card.id = `line-card-${item.id}`;
            
            // ==========================================
            // HIER DIE IDs DER BLÖCKE EINTRAGEN, DIE 250px NACH UNTEN SOLLEN:
            // ==========================================
            const pushDownCardIds = [24, 25, 26, 27];
            
            if (pushDownCardIds.includes(item.id)) {
                card.classList.add('push-down-card');
            }

            card.innerHTML = `<span class="card-uid">#${item.uid}</span><div class="line-header"><div class="line-number">${item.name}</div></div><div class="city-list"></div>`;
            const list = card.querySelector('.city-list');
            item.cities.forEach(c => {
                const div = document.createElement('div');
                div.className = 'city-item';
                div.textContent = c;
                div.setAttribute('data-city-norm', normalizeText(c));
                list.appendChild(div);
            });
            return card;
        }

        function render() {
            const left = document.getElementById('leftLinesContainer');
            const right = document.getElementById('rightLinesContainer');
            
            function buildGroup(group, target) {
                group.forEach(i => {
                    const col = document.createElement('div');
                    const hasSpecial = i.isSpecial || (i.bottomLine && i.bottomLine.isSpecial);
                    
                    if (i.splitBelow) {
                        col.className = hasSpecial ? 'line-column split-bottom-special' : 'line-column split-below-middle';
                    } else {
                        col.className = 'line-column';
                    }

                    col.appendChild(createCard(i));
                    if(i.bottomLine) {
                        col.appendChild(createCard(i.bottomLine));
                    }
                    target.appendChild(col);
                });
            }

            buildGroup(warehouseStructure.leftGroup, left);
            buildGroup(warehouseStructure.rightGroup, right);

            setTimeout(() => {
                centerOnElement(document.getElementById('centerColumn'), 'auto');
            }, 100);
        }

        function centerOnElement(el, behavior = 'smooth') {
            if (!el) return;
            const scrollWrapper = document.getElementById('scrollWrapper');
            const targetLeft = el.offsetLeft - (scrollWrapper.clientWidth / 2) + (el.clientWidth / 2);
            scrollWrapper.scrollTo({ left: targetLeft, behavior: behavior });
        }

        let lastSearchQuery = "";
        let matchCards = [];
        let currentMatchIndex = 0;

        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const searchBtn = document.getElementById('searchBtn');
        const searchResultsInfo = document.getElementById('searchResultsInfo');

        function performSearch(queryText) {
            const val = normalizeText(queryText.trim());
            const allCards = document.querySelectorAll('.line-card');
            
            clearBtn.style.display = queryText.length > 0 ? 'flex' : 'none';

            if (val === "") {
                allCards.forEach(card => {
                    card.classList.remove('active', 'dimmed');
                    card.querySelectorAll('.city-item').forEach(el => el.classList.remove('match'));
                });
                lastSearchQuery = "";
                matchCards = [];
                currentMatchIndex = 0;
                searchResultsInfo.textContent = "";
                searchResultsInfo.className = "search-results-info";
                return;
            }

            if (val !== lastSearchQuery) {
                lastSearchQuery = val;
                matchCards = [];
                currentMatchIndex = 0;

                allCards.forEach(card => {
                    const items = card.querySelectorAll('.city-item');
                    let match = false;
                    
                    items.forEach(el => {
                        const isMatch = val.length >= 2 && el.getAttribute('data-city-norm').includes(val);
                        el.classList.toggle('match', isMatch);
                        if(isMatch) match = true;
                    });
                    
                    card.classList.toggle('active', val.length >= 2 && match);
                    card.classList.toggle('dimmed', val.length >= 2 && !match);

                    if (match && val.length >= 2) {
                        matchCards.push(card);
                    }
                });
            } else if (matchCards.length > 0) {
                currentMatchIndex = (currentMatchIndex + 1) % matchCards.length;
            }

            if (val.length >= 2) {
                if (matchCards.length > 0) {
                    const treffTekst = matchCards.length === 1 ? "1 treff" : `${matchCards.length} treff`;
                    searchResultsInfo.textContent = treffTekst;
                    searchResultsInfo.className = "search-results-info success";
                    centerOnElement(matchCards[currentMatchIndex]);
                } else {
                    searchResultsInfo.textContent = "0 treff";
                    searchResultsInfo.className = "search-results-info zero";
                }
            } else {
                searchResultsInfo.textContent = "";
                searchResultsInfo.className = "search-results-info";
            }
        }

        searchInput.addEventListener('input', (e) => {
            performSearch(e.target.value);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                performSearch(e.target.value);
            }
        });

        searchBtn.addEventListener('click', () => {
            performSearch(searchInput.value);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = "";
            performSearch("");
            searchInput.focus();
        });

        render();
    </script>
</body>
</html>
