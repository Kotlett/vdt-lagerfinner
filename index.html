<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagerfinner - Komplett Oversikt</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --card-bg: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --highlight: #22c55e;
            --border-color: #475569;
            --special-border: #f97316;
            --break-bg: #312e81;
            --break-border: #6366f1;
            --middle-bg: #0f3854;
            --middle-border: #0284c7;
            --top-bg: #1d4ed8;
            --top-border: #60a5fa;
            --left-std-bg: #1e293b;
            --left-std-border: #3b82f6;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px 16px 70px 16px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        /* Feedback Button Oben Rechts */
        .feedback-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: var(--danger);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            transition: all 0.2s ease;
            z-index: 200;
            text-decoration: none;
        }
        .feedback-btn:hover {
            background-color: var(--danger-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.6);
        }
        .feedback-btn .icon {
            font-size: 1rem;
        }

        header { 
            max-width: 1400px; 
            margin: 4px auto 8px auto; 
            width: 100%; 
            text-align: left; 
            padding-right: 130px; 
        }
        h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 1px; }
        .update-date { font-size: 0.7rem; color: var(--text-muted); opacity: 0.7; }

        .search-container { max-width: 650px; margin: 0 auto 12px auto; width: 100%; position: sticky; top: 12px; z-index: 100; }
        
        .subtitle { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            margin-bottom: 6px; 
            text-align: center; 
            width: 100%; 
        }

        .search-box { position: relative; width: 100%; display: flex; align-items: center; }
        
        #searchInput { 
            width: 100%; 
            padding: 14px 55px 14px 50px; 
            font-size: 1.15rem; 
            font-weight: 600; 
            border: 2px solid var(--accent); 
            border-radius: 12px; 
            background-color: var(--panel-bg); 
            color: #ffffff; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); 
            outline: none; 
        }
        #searchInput:focus { border-color: var(--highlight); box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.25); }

        .clear-btn { 
            position: absolute; 
            left: 16px; 
            background: none; 
            border: none; 
            color: var(--text-muted); 
            font-size: 1.2rem; 
            cursor: pointer; 
            padding: 4px; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 5; 
            width: 30px; 
            height: 30px; 
        }
        .clear-btn:hover { color: #ffffff; }

        .search-btn { position: absolute; right: 16px; background: none; border: none; color: var(--accent); font-size: 1.4rem; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; z-index: 5; width: 30px; height: 30px; }
        .search-btn:hover { color: var(--highlight); }

        .search-results-info { font-size: 0.85rem; font-weight: 600; text-align: center; margin-top: 4px; min-height: 18px; }
        .search-results-info.success { color: var(--highlight); }
        .search-results-info.zero { color: #ef4444; }

        .warehouse-scroll-wrapper { width: 100%; overflow-x: auto; padding-bottom: 16px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        
        .warehouse-layout {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: max-content;
            align-items: center;
        }

        .warehouse-row {
            display: flex;
            gap: 16px;
            align-items: stretch;
            width: 100%;
            justify-content: center;
        }

        #rowMiddle {
            margin-top: -175px;
            position: relative;
            z-index: 5;
        }

        #rowBottom {
            align-items: flex-end;
            margin-top: -400px;
            position: relative;
            z-index: 10;
        }

        .line-column, .slot-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 170px;
            flex-shrink: 0;
        }

        .center-column { display: flex; flex-direction: column; gap: 12px; width: 180px; flex-shrink: 0; height: 350px; }
        
        #centerBotColumn {
            width: 185px !important;
            flex-shrink: 0;
        }
        
        .break-room {
            background-color: var(--break-bg);
            border: 2px dashed var(--break-border);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 150px;
        }
        .break-room .icon { font-size: 1.3rem; margin-bottom: 2px; }
        .break-room .title { font-weight: 800; font-size: 0.85rem; color: #a5b4fc; }

        .lager-mitte {
            background-color: var(--middle-bg);
            border: 2px solid var(--middle-border);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            height: calc(100% + 50px);
            min-height: 200px;
        }
        .lager-mitte .icon { font-size: 2rem; margin-bottom: 6px; }
        .lager-mitte .title { font-weight: 800; font-size: 1rem; color: #7dd3fc; letter-spacing: 1px; }
        
        .line-card { background-color: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 10px; padding: 12px; width: 100%; display: flex; flex-direction: column; transition: all 0.25s ease; position: relative; height: auto; }
        
        .line-card.left-std-card {
            border-color: var(--left-std-border);
            background-color: #172554;
        }

        .card-uid { position: absolute; top: 4px; left: 8px; font-size: 0.6rem; color: var(--text-muted); opacity: 0.5; }
        .special-card { border-color: var(--special-border) !important; background-color: #2a1b18; }
        .top-card { border-color: var(--top-border) !important; background-color: #112240; }
        
        .line-header { background-color: var(--card-bg); border-radius: 6px; padding: 8px; text-align: center; margin-top: 8px; margin-bottom: 10px; border-bottom: 3px solid var(--accent); }
        .left-std-card .line-header { background-color: #1e3a8a; border-bottom-color: var(--accent); }
        .special-card .line-header { border-bottom-color: var(--special-border) !important; }
        .top-card .line-header { border-bottom-color: var(--top-border) !important; }
        
        .line-number { font-size: 1rem; font-weight: 800; color: var(--accent); }
        .special-card .line-number { color: var(--special-border); }
        .top-card .line-number { color: var(--top-border); }
        
        .city-list { display: flex; flex-direction: column; gap: 6px; }
        .city-item { background-color: rgba(255, 255, 255, 0.05); padding: 6px 8px; border-radius: 6px; font-size: 0.85rem; color: #e2e8f0; }
        .line-card.active { border-color: var(--highlight) !important; background-color: #064e3b !important; transform: translateY(-4px); box-shadow: 0 10px 20px -5px rgba(34, 197, 94, 0.4); }
        .city-item.match { background-color: var(--highlight); color: #ffffff; font-weight: 700; }
        .line-card.dimmed { opacity: 0.25; filter: grayscale(80%); }

        /* Minimap / Positionsbalken unten */
        .warehouse-minimap-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            border-top: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .minimap-wrapper {
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .minimap-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
            position: relative;
            height: 14px;
        }

        .minimap-labels span:nth-child(2) {
            position: absolute;
            left: 45%;
            transform: translateX(-50%);
        }

        .warehouse-minimap {
            position: relative;
            height: 22px;
            background-color: #1e293b;
            border-radius: 11px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            overflow: hidden;
            touch-action: none; /* Deaktiviert Browser-Gesten auf der Leiste für sofortige Reaktion */
        }

        .minimap-center-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 45%;
            width: 3px;
            background-color: var(--accent);
            opacity: 0.8;
            transform: translateX(-50%);
            z-index: 2;
            pointer-events: none;
        }

        .minimap-thumb {
            position: absolute;
            top: 2px;
            bottom: 2px;
            left: 0;
            background: linear-gradient(90deg, #38bdf8, #22c55e);
            border-radius: 9px;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            cursor: grab;
            will-change: left;
        }
        .minimap-thumb:active {
            cursor: grabbing;
        }
    </style>
</head>

        function normalizeText(t) { return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[æøå]/g, m => ({'æ':'a','ø':'o','å':'a'}[m])); }

        function createCard(item) {
            const card = document.createElement('div');
            card.className = `line-card ${item.isSpecial ? 'special-card' : ''} ${item.isTop ? 'top-card' : ''} ${item.isLeftStd ? 'left-std-card' : ''}`;
            card.id = `line-card-${item.id}`;
            card.innerHTML = `<span class="card-uid">#${item.uid}</span><div class="line-header"><div class="line-number">${item.name}</div></div><div class="city-list"></div>`;
            const list = card.querySelector('.city-list');
            item.cities.forEach(c => {
                const div = document.createElement('div');
                div.className = 'city-item';
                div.textContent = c;
                div.setAttribute('data-city-norm', normalizeText(c));
                list.appendChild(div);
            });
            return card;
        }

        function render() {
            const rowTop = document.getElementById('rowTop');
            const rowMiddle = document.getElementById('rowMiddle');
            const rowBottom = document.getElementById('rowBottom');

            warehouseStructure.leftGroup.forEach((i) => {
                const slotTop = document.createElement('div');
                slotTop.className = 'line-column';
                slotTop.id = `col-${i.id}`;
                slotTop.appendChild(createCard(i));
                rowTop.appendChild(slotTop);

                const slotMid = document.createElement('div');
                slotMid.className = 'slot-column';
                rowMiddle.appendChild(slotMid);

                const slotBot = document.createElement('div');
                slotBot.className = 'slot-column';
                if (i.bottomLine) {
                    slotBot.appendChild(createCard(i.bottomLine));
                }
                rowBottom.appendChild(slotBot);
            });

            const centerTop = document.createElement('div');
            centerTop.className = 'center-column';
            const breakRoom = document.createElement('div');
            breakRoom.className = 'break-room';
            breakRoom.innerHTML = `<div class="icon">☕</div><div class="title">PAUSEROM</div>`;
            centerTop.appendChild(breakRoom);
            rowTop.appendChild(centerTop);

            const centerMid = document.createElement('div');
            centerMid.className = 'center-column';
            centerMid.id = 'centerColumn';
            const lagerMitte = document.createElement('div');
            lagerMitte.className = 'lager-mitte';
            lagerMitte.innerHTML = `<div class="icon">📦</div><div class="title">LAGER MIDT</div>`;
            centerMid.appendChild(lagerMitte);
            rowMiddle.appendChild(centerMid);

            const centerBot = document.createElement('div');
            centerBot.className = 'slot-column';
            centerBot.id = 'centerBotColumn';
            rowBottom.appendChild(centerBot);

            warehouseStructure.rightGroup.forEach((group) => {
                const slotTop = document.createElement('div');
                slotTop.className = 'slot-column';
                if (group.top) slotTop.appendChild(createCard(group.top));
                rowTop.appendChild(slotTop);

                const slotMid = document.createElement('div');
                slotMid.className = 'slot-column';
                if (group.middle) slotMid.appendChild(createCard(group.middle));
                rowMiddle.appendChild(slotMid);

                const slotBot = document.createElement('div');
                slotBot.className = 'slot-column';
                if (group.bottom) slotBot.appendChild(createCard(group.bottom));
                rowBottom.appendChild(slotBot);
            });

            setTimeout(() => {
                centerOnElement(document.getElementById('centerColumn'), 'auto');
                updateMinimap();
            }, 100);
        }

        function centerOnElement(el, behavior = 'smooth') {
            if (!el) return;
            const scrollWrapper = document.getElementById('scrollWrapper');
            const targetLeft = el.offsetLeft - (scrollWrapper.clientWidth / 2) + (el.clientWidth / 2);
            scrollWrapper.scrollTo({ left: targetLeft, behavior: behavior });
        }

        const scrollWrapper = document.getElementById('scrollWrapper');
        const minimap = document.getElementById('minimap');
        const minimapThumb = document.getElementById('minimapThumb');

        function updateMinimap() {
            const maxScroll = scrollWrapper.scrollWidth - scrollWrapper.clientWidth;
            if (maxScroll <= 0) return;
            
            const scrollPercent = scrollWrapper.scrollLeft / maxScroll;
            const minimapWidth = minimap.clientWidth;
            const calculatedWidth = (scrollWrapper.clientWidth / scrollWrapper.scrollWidth) * minimapWidth;
            const thumbWidth = Math.max(calculatedWidth, 50);
            
            minimapThumb.style.width = `${thumbWidth}px`;
            
            const availableSpace = minimapWidth - thumbWidth;
            const thumbLeft = scrollPercent * availableSpace;
            minimapThumb.style.left = `${thumbLeft}px`;
        }

        scrollWrapper.addEventListener('scroll', updateMinimap, { passive: true });
        window.addEventListener('resize', updateMinimap);

        // Ultrafast Touch & Drag Logic direkt über die gesamte Minimap
        let isDragging = false;

        function handleMove(clientX) {
            if (!isDragging) return;
            const rect = minimap.getBoundingClientRect();
            const thumbWidth = minimapThumb.offsetWidth;
            const availableSpace = rect.width - thumbWidth;

            if (availableSpace <= 0) return;

            let touchX = clientX - rect.left - (thumbWidth / 2);
            touchX = Math.max(0, Math.min(touchX, availableSpace));

            const percent = touchX / availableSpace;
            const maxScroll = scrollWrapper.scrollWidth - scrollWrapper.clientWidth;
            
            // Direktes Setzen ohne Animation-Frame Verzögerung
            scrollWrapper.scrollLeft = percent * maxScroll;
            minimapThumb.style.left = `${touchX}px`;
        }

        minimap.addEventListener('pointerdown', (e) => {
            isDragging = true;
            minimap.setPointerCapture(e.pointerId);
            handleMove(e.clientX);
        });

        minimap.addEventListener('pointermove', (e) => {
            if (isDragging) {
                handleMove(e.clientX);
            }
        });

        minimap.addEventListener('pointerup', (e) => {
            isDragging = false;
            try { minimap.releasePointerCapture(e.pointerId); } catch(err) {}
        });

        minimap.addEventListener('pointercancel', (e) => {
            isDragging = false;
        });

        let lastSearchQuery = "";
        let matchCards = [];
        let currentMatchIndex = 0;

        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const searchBtn = document.getElementById('searchBtn');
        const searchResultsInfo = document.getElementById('searchResultsInfo');

        function performSearch(queryText) {
            const val = normalizeText(queryText.trim());
            const allCards = document.querySelectorAll('.line-card');
           
            clearBtn.style.display = queryText.length > 0 ? 'flex' : 'none';

            if (val === "") {
                allCards.forEach(card => {
                    card.classList.remove('active', 'dimmed');
                    card.querySelectorAll('.city-item').forEach(el => el.classList.remove('match'));
                });
                lastSearchQuery = "";
                matchCards = [];
                currentMatchIndex = 0;
                searchResultsInfo.textContent = "";
                searchResultsInfo.className = "search-results-info";
                return;
            }

            if (val !== lastSearchQuery) {
                lastSearchQuery = val;
                matchCards = [];
                currentMatchIndex = 0;

                allCards.forEach(card => {
                    const items = card.querySelectorAll('.city-item');
                    let match = false;
                   
                    items.forEach(el => {
                        const isMatch = val.length >= 2 && el.getAttribute('data-city-norm').includes(val);
                        el.classList.toggle('match', isMatch);
                        if(isMatch) match = true;
                    });
                   
                    card.classList.toggle('active', val.length >= 2 && match);
                    card.classList.toggle('dimmed', val.length >= 2 && !match);

                    if (match && val.length >= 2) {
                        matchCards.push(card);
                    }
                });
            } else if (matchCards.length > 0) {
                currentMatchIndex = (currentMatchIndex + 1) % matchCards.length;
            }

            if (val.length >= 2) {
                if (matchCards.length > 0) {
                    const treffTekst = matchCards.length === 1 ? "1 treff" : `${matchCards.length} treff`;
                    searchResultsInfo.textContent = treffTekst;
                    searchResultsInfo.className = "search-results-info success";
                    centerOnElement(matchCards[currentMatchIndex]);
                } else {
                    searchResultsInfo.textContent = "0 treff";
                    searchResultsInfo.className = "search-results-info zero";
                }
            } else {
                searchResultsInfo.textContent = "";
                searchResultsInfo.className = "search-results-info";
            }
        }

        searchInput.addEventListener('input', (e) => performSearch(e.target.value));
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') performSearch(e.target.value); });
        searchBtn.addEventListener('click', () => performSearch(searchInput.value));
        clearBtn.addEventListener('click', () => { searchInput.value = ""; performSearch(""); searchInput.focus(); });

        render();
    </script>
</body>
</html>
