<style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --card-bg: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --highlight: #22c55e;
            --border-color: #475569;
            --special-border: #f97316;
            --break-bg: #312e81;
            --break-border: #6366f1;
            --middle-bg: #0f3854;
            --middle-border: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Container, der alles hält */
        .warehouse-scroll-wrapper { width: 100%; overflow-x: auto; padding-bottom: 16px; flex-grow: 1; }
        
        /* WICHTIG: Align-items: flex-start, damit die Höhen von Lager Mitte die Spalten nicht strecken */
        .warehouse-layout { display: flex; gap: 16px; min-width: max-content; justify-content: center; align-items: flex-start; padding-top: 96px; }
        
        .line-column { display: flex; flex-direction: column; gap: 12px; width: 170px; flex-shrink: 0; }
        
        /* Wenn wir kein margin-top mehr nutzen (da padding-top am Container), 
           müssen wir nur noch für die exakte Spalte (23/24) das Grid setzen */
        .line-column.align-with-middle-exact {
            display: grid;
            grid-template-rows: auto 1fr;
            /* Diese Spalte muss genau so hoch sein wie das Lager Mitte */
            /* Da wir Lager Mitte in der Mitte haben, setzen wir hier eine feste Höhe */
            height: 262px; 
        }
        
        .line-column.align-with-middle-exact > .line-card:last-child { align-self: end; }

        .center-column { display: flex; flex-direction: column; gap: 12px; width: 180px; flex-shrink: 0; }
        
        /* ... (Restliche Styles unverändert lassen) ... */
        .break-room { background-color: var(--break-bg); border: 2px dashed var(--break-border); border-radius: 10px; padding: 10px; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 70px; }
        .lager-mitte { background-color: var(--middle-bg); border: 2px solid var(--middle-border); border-radius: 10px; padding: 20px; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: inset 0 0 15px rgba(0,0,0,0.3); }
        .line-card { background-color: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 10px; padding: 12px; width: 100%; display: flex; flex-direction: column; position: relative; }
        
        /* ... (den Rest bitte aus deinem vorherigen Skript übernehmen) ... */
    </style>
