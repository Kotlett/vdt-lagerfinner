<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vartdal-Transport Lagerfinner</title>
    <style>
        :root {
            --bg-color: #0f172a; --panel-bg: #1e293b; --card-bg: #334155;
            --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #38bdf8;
            --highlight: #22c55e; --border-color: #475569; --special-border: #f97316;
            --middle-bg: #0f3854;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); padding: 16px; min-height: 100vh; }

        .warehouse-scroll-wrapper { width: 100%; overflow-x: auto; padding-top: 100px; }
        .warehouse-layout { display: flex; gap: 16px; min-width: max-content; justify-content: center; align-items: start; }
        
        .line-column { display: flex; flex-direction: column; gap: 12px; width: 170px; }
        
        /* Rechte Seite: Grid mit 3 Reihen */
        .right-side-container { 
            display: grid; 
            grid-auto-flow: column; 
            grid-template-rows: repeat(3, auto); 
            gap: 12px;
            align-items: start;
        }

        .slot-middle { grid-row: 2; }
        .slot-bottom { grid-row: 3; align-self: end; }

        .center-column { display: flex; flex-direction: column; gap: 12px; width: 180px; }
        .lager-mitte { background-color: var(--middle-bg); border: 2px solid #0284c7; border-radius: 10px; padding: 20px; text-align: center; font-weight: bold; }
        
        .line-card { background-color: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 10px; padding: 12px; }
        .special-card { border-color: var(--special-border) !important; background-color: #2a1b18; }
        .line-header { font-weight: 800; color: var(--accent); margin-bottom: 8px; border-bottom: 2px solid var(--accent); }
        .city-item { font-size: 0.8rem; margin-top: 4px; color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="warehouse-scroll-wrapper">
        <div class="warehouse-layout">
            <div class="left-side-container" id="leftLinesContainer"></div>
            <div class="center-column">
                <div class="lager-mitte">📦 LAGER MIDT</div>
            </div>
            <div class="right-side-container" id="rightLinesContainer"></div>
        </div>
    </div>

    <script>
        const warehouseStructure = {
            leftGroup: [
                { id: 1, name: "(L) Linje 1", cities: ["Molde", "Ålesund"] }
            ],
            rightGroup: [
                { id: 23, name: "(R) 23", cities: ["Hønefoss"], bottomLine: { id: 24, name: "(R) 24", isSpecial: true, cities: ["Skeidar, Ålesund"] } },
                { id: 25, name: "(R) 25", cities: ["Raufoss"] },
                { id: 26, name: "(R) 26", cities: ["Gjøvik"] },
                { id: 43, name: "(R) 43", isSpecial: true, cities: ["Ulsteinvik"] }
            ]
        };

        function createCard(item) {
            const card = document.createElement('div');
            card.className = `line-card ${item.isSpecial ? 'special-card' : ''}`;
            card.innerHTML = `<div class="line-header">${item.name}</div>` +
                             item.cities.map(c => `<div class="city-item">${c}</div>`).join('');
            return card;
        }

        function render() {
            // Links
            const left = document.getElementById('leftLinesContainer');
            warehouseStructure.leftGroup.forEach(i => {
                const col = document.createElement('div');
                col.className = 'line-column';
                col.appendChild(createCard(i));
                left.appendChild(col);
            });

            // Rechts
            const right = document.getElementById('rightLinesContainer');
            warehouseStructure.rightGroup.forEach(i => {
                const col = document.createElement('div');
                // Slot-Logik
                if ([23, 25, 26].includes(i.id)) col.className = 'line-column slot-middle';
                else if (i.isSpecial || (i.bottomLine && i.bottomLine.isSpecial)) col.className = 'line-column slot-bottom';
                else col.className = 'line-column';
                
                if (i.bottomLine) col.style.gridRow = "span 2";
                
                col.appendChild(createCard(i));
                if(i.bottomLine) col.appendChild(createCard(i.bottomLine));
                right.appendChild(col);
            });
        }
        
        render();
    </script>
</body>
</html>
